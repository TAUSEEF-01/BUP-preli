[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = true

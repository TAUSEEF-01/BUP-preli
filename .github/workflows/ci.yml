name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app scripts
      - name: Lint
        run: python -m ruff check app scripts tests
      - name: Type check
        run: python -m mypy
      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt
      - name: Scan source for security issues
        run: python -m bandit -q -r app scripts
      - name: Build container image
        run: docker build --tag gridwise:ci .
